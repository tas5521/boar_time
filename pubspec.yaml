name: boar_time
description: "Time management for boar hunting project."
publish_to: 'none'

version: 1.1.0+7

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8  
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3+1
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2
  freezed_annotation: ^3.0.0-dev.0
  pdf: ^3.11.0
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  excel: ^4.0.6
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.3
  isar_community: ^3.3.0
  isar_community_flutter_libs: ^3.3.0
  auto_route: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.15.0
  freezed: ^3.0.0-dev.0
  isar_community_generator: ^3.3.0-dev.2
  flutter_native_splash: ^2.4.4
  auto_route_generator: ^10.5.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/NotoSansJP-VariableFont_wght.ttf
    - assets/images/contents/

  fonts:
    - family: MyFlutterApp
      fonts:
        - asset: assets/fonts/MyFlutterApp.ttf

flutter_icons: 
  image_path_android: assets/launcher_icon/android_icon.png
  adaptive_icon_background: assets/launcher_icon/android_icon_background.png
  adaptive_icon_foreground: assets/launcher_icon/android_icon_foreground.png
  image_path_ios: assets/launcher_icon/ios_icon.png
  android: true
  adaptive_icon_padding: true
  min_sdk_android: 21
  ios: true

flutter_native_splash: 
  color: "#F0E7DB"
  image: "assets/images/splash/splash.png"
  android_12: 
    icon_background_color: "#F0E7DB"
    image: "assets/images/splash/splash.png"
  android: true
  ios: true
  fullscreen: true
