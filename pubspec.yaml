name: boar_time
description: "Time management for boar hunting project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8  
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3+1
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2
  isar: 3.1.0
  isar_flutter_libs: 3.1.0
  freezed_annotation: ^2.4.1
  pdf: ^3.11.0
  open_filex: ^4.5.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  isar_generator: 3.1.0
  build_runner: ^2.4.10
  freezed: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/NotoSansJP-VariableFont_wght.ttf

  fonts:
    - family: MyFlutterApp
      fonts:
        - asset: assets/fonts/MyFlutterApp.ttf
