name: boar_time
description: "Time management for boar hunting project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

isar_version: &isar_version 3.1.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8  
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3+1
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2
  isar: *isar_version
  isar_flutter_libs: *isar_version
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  isar_generator: *isar_version
  build_runner: any

flutter:
  uses-material-design: true
  fonts:
    - family: MyFlutterApp
      fonts:
        - asset: assets/fonts/MyFlutterApp.ttf
